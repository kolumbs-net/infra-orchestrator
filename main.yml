---
# Master playbook – provisions all managed devices.
# Run: ansible-playbook main.yml --ask-vault-pass

- name: Common Setup for all Pi servers
  hosts: servers
  become: true
  tasks:
    - name: Ensure common packages are installed
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - vim
          - curl
          - git
          - htop
        state: present

- name: Provision web servers
  hosts: web_server
  become: true
  tasks:
    - name: Ensure Apache package version constraint is defined
      ansible.builtin.assert:
        that:
          - apache_package_version is defined
          - (apache_package_version | string | length) > 0
        fail_msg: "apache_package_version must be set (for example: 2.4.67*)."

    - name: Install Apache package using version constraint
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: "{{ apache_package_name }}={{ apache_package_version }}"
        state: present

    - name: Ensure Apache service is enabled and running
      ansible.builtin.service:
        name: "{{ apache_service_name }}"
        enabled: true
        state: started

    - name: Ensure Apache proxy modules are enabled
      ansible.builtin.command: a2enmod {{ item }}
      args:
        creates: "/etc/apache2/mods-enabled/{{ item }}.load"
      loop:
        - proxy
        - proxy_http
        - proxy_wstunnel
      notify: Reload Apache

    - name: Ensure the directory for Ansible-managed routes exists
      ansible.builtin.file:
        path: "{{ apache_routes_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Find the TLS vhost file behind sites-enabled
      ansible.builtin.stat:
        path: "{{ apache_tls_vhost }}"
      register: apache_tls_vhost_file

    - name: Ensure the TLS vhost includes the Ansible-managed routes
      ansible.builtin.lineinfile:
        path: "{{ apache_tls_vhost_file.stat.lnk_source | default(apache_tls_vhost) }}"
        line: "        IncludeOptional {{ apache_routes_dir }}/*.conf"
        insertbefore: '^\s*</VirtualHost>'
        firstmatch: true
      notify: Reload Apache

  handlers:
    - name: Apache handlers
      ansible.builtin.import_tasks: handlers/apache.yml

- name: Provide the build toolchain
  hosts: servers
  become: true
  tasks:
    - name: Toolchain
      ansible.builtin.import_tasks: tasks/toolchain.yml

- name: Provision GitHub Actions Runner (Pi)
  hosts: pi-server-1
  become: true
  pre_tasks:
    - name: Detect userland architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      check_mode: false

    - name: Ensure the userland architecture has a GitHub Actions runner build
      ansible.builtin.assert:
        that:
          - (dpkg_arch.stdout | trim) in github_actions_architecture_by_dpkg
        fail_msg: >-
          No GitHub Actions runner build mapped for dpkg architecture
          '{{ dpkg_arch.stdout | trim }}'. Known: {{ github_actions_architecture_by_dpkg.keys() | list | join(', ') }}.
      vars:
        github_actions_architecture_by_dpkg: &arch_map
          armhf: arm
          arm64: arm64
          amd64: x64

    - name: Map Debian architecture to GitHub Actions runner architecture
      ansible.builtin.set_fact:
        runner_arch: "{{ github_actions_architecture_by_dpkg[dpkg_arch.stdout | trim] }}"
      vars:
        github_actions_architecture_by_dpkg: *arch_map

    - name: Ensure the GitHub Actions runner user exists
      ansible.builtin.user:
        name: "{{ github_runner_user }}"
        shell: /usr/sbin/nologin
        create_home: true
        password_lock: true
        state: present
  roles:
    - role: monolithprojects.github_actions_runner
      vars:
        access_token: "{{ github_runner_registration_token }}"
        runner_org: true
        runner_group: "Default"
        hide_sensitive_logs: false
        github_actions_architecture: "{{ runner_arch }}"
        runner_user: "{{ github_runner_user }}"
        runner_name: "pi-server-1"
        runner_labels:
          - pi-server-1

- name: Provision service slots (pi-server-1)
  hosts: pi-server-1
  become: true
  tasks:
    - name: Ensure the botforge admin password is in the vault
      ansible.builtin.assert:
        that:
          - vault_botforge_admin_password is defined
          - (vault_botforge_admin_password | string | length) > 0
        fail_msg: "Add vault_botforge_admin_password with: ansible-vault edit group_vars/all/vault.yml"
      no_log: true

    - name: Botforge slot
      ansible.builtin.include_tasks: tasks/service_slot.yml
      vars:
        slot_name: botforge
        slot_port: "{{ botforge_port }}"
        slot_route: "{{ botforge_route }}"
        slot_env:
          ADMIN_PASSWORD: "{{ botforge_admin_password }}"

  handlers:
    - name: Apache handlers
      ansible.builtin.import_tasks: handlers/apache.yml
