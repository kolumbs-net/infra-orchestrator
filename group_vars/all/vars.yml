---
# Silent bridge – maps vault secrets to standard Ansible/role variable names.
# This file is safe to commit: it contains no real data, only variable references.
# vault.yml holds the vault_ secrets — must stay AES-256 encrypted. See README.

ansible_user: "{{ vault_ansible_user }}"
ansible_ssh_private_key_file: "{{ vault_ansible_ssh_private_key_file }}"
ansible_port: "{{ vault_ssh_port }}"
ansible_python_interpreter: /usr/bin/python3

github_runner_registration_token: "{{ vault_github_runner_registration_token }}"
github_runner_user: "{{ vault_github_runner_user }}"
github_account: "kolumbs-net"

system_timezone: "Europe/Riga"

apache_package_name: "apache2"
apache_package_version: "2.4.67*" # allow distro-specific package suffixes while pinning major.minor.patch
apache_service_name: "apache2"

# --- Apache: Ansible-managed routes on the TLS vhost ---
# The vhost itself (certificates, existing routes) is still hand-managed; it gets
# one IncludeOptional line, and every route Ansible owns is a file in this directory.
apache_tls_vhost: /etc/apache2/sites-enabled/kolumbs-ssl.conf
apache_routes_dir: /etc/apache2/kolumbs.net.d

# --- Build toolchain provided to deployment pipelines (see tasks/toolchain.yml) ---
python_version: "3.11.2"   # the distribution's python3.11, matching piwheels
uv_version: "0.13.0"
rustup_version: "1.29.1"
rust_version: "1.97.1"

toolchain_manifest: /etc/kolumbs/toolchain.env
toolchain_python: /usr/bin/python3.11
toolchain_uv: /usr/local/bin/uv
rust_rustup_home: /opt/rust/rustup
rust_cargo_home: /opt/rust/cargo
toolchain_target_by_dpkg:
  armhf: armv7-unknown-linux-gnueabihf
  arm64: aarch64-unknown-linux-gnu
  amd64: x86_64-unknown-linux-gnu
uv_url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-{{ toolchain_target }}.tar.gz"
rustup_url: "https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/{{ toolchain_target }}/rustup-init"

# --- Service slots (see tasks/service_slot.yml) ---
botforge_port: 1609
botforge_route: /ws/personal
botforge_admin_password: "{{ vault_botforge_admin_password }}"
