---
# A service slot: everything a service needs from the host so that its own
# pipeline can build and deploy it with no further infra changes.
#
# The contract with the service's pipeline:
#   - the runner account owns /opt/<slot_name>; the pipeline puts a release
#     there and points /opt/<slot_name>/current at it
#   - the service runs /opt/<slot_name>/current/start as the <slot_name>
#     account, with PORT in its environment
#   - anything else the service needs - configuration, secrets - is its
#     pipeline's business: it writes them under /opt/<slot_name>, where the
#     setgid directory makes them readable to the service and nobody else
#   - anything it keeps goes in $STATE_DIRECTORY (/var/lib/<slot_name>)
#   - the runner may run exactly `systemctl restart <slot_name>`, nothing else
#
# Infra knows only what is infra's: the port it allocates and the route to it.
#
# Parameters:
#   slot_name      service and account name
#   slot_port      port the service listens on: localhost only for TCP; a UDP
#                  service may listen on the LAN, since the router never
#                  forwards it
#   slot_protocol  optional, tcp (default) or udp
#   slot_route     optional public path on the TLS vhost, proxied as a websocket

- name: "{{ slot_name }}: check the slot's parameters"
  ansible.builtin.assert:
    that:
      - slot_name is match('^[a-z][a-z0-9-]*$')
      - slot_port | int > 1024
      - slot_protocol | default('tcp') in ['tcp', 'udp']
    fail_msg: "{{ slot_name }}: needs a lowercase name, a port above 1024 and protocol tcp or udp."

- name: "{{ slot_name }}: service account"
  ansible.builtin.user:
    name: "{{ slot_name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/{{ slot_name }}"
    create_home: false
    password_lock: true
    state: present

# Setgid to the service's group: everything the runner writes here is readable
# by the service, and other accounts cannot enter at all.
- name: "{{ slot_name }}: deploy directory, owned by the runner"
  ansible.builtin.file:
    path: "/opt/{{ slot_name }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ slot_name }}"
    mode: "2750"

- name: "{{ slot_name }}: check whether the slot exists yet"
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ slot_name }}.service"
  register: slot_unit_file

# Only on first provisioning - afterwards the service itself holds the port.
- name: "{{ slot_name }}: read listeners on its port"
  ansible.builtin.command: ss -l{{ 'u' if slot_protocol | default('tcp') == 'udp' else 't' }}nH "sport = :{{ slot_port }}"
  register: slot_port_listeners
  changed_when: false
  check_mode: false
  when: not slot_unit_file.stat.exists

- name: "{{ slot_name }}: ensure its port is free"
  ansible.builtin.assert:
    that:
      - slot_port_listeners.stdout | trim | length == 0
    fail_msg: "{{ slot_name }}: its port is already in use."
  when: not slot_unit_file.stat.exists

- name: "{{ slot_name }}: systemd unit"
  ansible.builtin.template:
    src: service.unit.j2
    dest: "/etc/systemd/system/{{ slot_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: slot_unit

# Enabled but not started: it starts on the first deploy, once a release exists.
- name: "{{ slot_name }}: enable the service"
  ansible.builtin.systemd_service:
    name: "{{ slot_name }}"
    enabled: true
    daemon_reload: "{{ slot_unit.changed }}"

- name: "{{ slot_name }}: restart if its unit changed"
  ansible.builtin.command: systemctl try-restart {{ slot_name }}
  when: slot_unit.changed
  changed_when: true

- name: "{{ slot_name }}: let the runner restart it, and nothing else"
  ansible.builtin.template:
    src: service.sudoers.j2
    dest: "/etc/sudoers.d/{{ github_runner_user }}-{{ slot_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: "{{ slot_name }}: public route"
  ansible.builtin.template:
    src: service.route.conf.j2
    dest: "{{ apache_routes_dir }}/{{ slot_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: slot_route is defined
  notify: Reload Apache
