---
# A service slot: everything a service needs from the host so that its own
# pipeline can build and deploy it with no further infra changes.
#
# The contract with the service's pipeline:
#   - the runner account owns /opt/<slot_name>; the pipeline puts a release
#     there and points /opt/<slot_name>/current at it
#   - the service runs /opt/<slot_name>/current/start as the <slot_name>
#     account, with each of its ports in the environment variable the slot
#     names for it
#   - anything else the service needs - configuration, secrets - is its
#     pipeline's business: it writes them under /opt/<slot_name>, where the
#     setgid directory makes them readable to the service and nobody else
#   - anything it keeps goes in $STATE_DIRECTORY (/var/lib/<slot_name>)
#   - the runner may run exactly `systemctl restart <slot_name>`, nothing else
#
# Infra knows only what is infra's: the ports it allocates and the routes to them.
#
# Parameters (one service_slots entry, checked by tasks/service_slots_check.yml):
#   slot_name   service and account name
#   slot_ports  list of { env, port, protocol, exposure, route?, route_scheme? }:
#               a TCP service listens on localhost only; a UDP service may
#               listen on the LAN, since the router never forwards it

- name: "{{ slot_name }}: service account"
  ansible.builtin.user:
    name: "{{ slot_name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/{{ slot_name }}"
    create_home: false
    password_lock: true
    state: present

# Setgid to the service's group: everything the runner writes here is readable
# by the service, and other accounts cannot enter at all.
- name: "{{ slot_name }}: deploy directory, owned by the runner"
  ansible.builtin.file:
    path: "/opt/{{ slot_name }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ slot_name }}"
    mode: "2750"

- name: "{{ slot_name }}: read its current unit"
  ansible.builtin.slurp:
    path: "/etc/systemd/system/{{ slot_name }}.service"
  register: slot_current_unit
  failed_when: false

# A port the current unit already declares is held by the service itself.
- name: "{{ slot_name }}: read listeners on its new ports"
  ansible.builtin.command: ss -l{{ 'u' if item.protocol == 'udp' else 't' }}nH "sport = :{{ item.port }}"
  register: slot_port_listeners
  changed_when: false
  check_mode: false
  loop: "{{ slot_ports }}"
  loop_control:
    label: "{{ item.env }}"
  when: item.port | string not in slot_declared_ports
  vars:
    slot_declared_ports: >-
      {{ (slot_current_unit.content | default('') | b64decode).splitlines()
         | select('match', '^Environment=[A-Z][A-Z0-9_]*=[0-9]+$')
         | map('regex_replace', '^[^=]*=[^=]*=', '') | list }}

- name: "{{ slot_name }}: ensure its new ports are free"
  ansible.builtin.assert:
    that:
      - item.skipped | default(false) or item.stdout | trim | length == 0
    fail_msg: "{{ slot_name }}: the port for {{ item.item.env }} is already in use."
    quiet: true
  loop: "{{ slot_port_listeners.results }}"
  loop_control:
    label: "{{ item.item.env }}"

- name: "{{ slot_name }}: systemd unit"
  ansible.builtin.template:
    src: service.unit.j2
    dest: "/etc/systemd/system/{{ slot_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: slot_unit

# Enabled but not started: it starts on the first deploy, once a release exists.
- name: "{{ slot_name }}: enable the service"
  ansible.builtin.systemd_service:
    name: "{{ slot_name }}"
    enabled: true
    daemon_reload: "{{ slot_unit.changed }}"

- name: "{{ slot_name }}: restart if its unit changed"
  ansible.builtin.command: systemctl try-restart {{ slot_name }}
  when: slot_unit.changed
  changed_when: true

- name: "{{ slot_name }}: let the runner restart it, and nothing else"
  ansible.builtin.template:
    src: service.sudoers.j2
    dest: "/etc/sudoers.d/{{ github_runner_user }}-{{ slot_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: "{{ slot_name }}: public routes"
  ansible.builtin.template:
    src: service.route.conf.j2
    dest: "{{ apache_routes_dir }}/{{ slot_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: slot_routes | length > 0
  notify: Reload Apache

- name: "{{ slot_name }}: no public routes"
  ansible.builtin.file:
    path: "{{ apache_routes_dir }}/{{ slot_name }}.conf"
    state: absent
  when: slot_routes | length == 0
  notify: Reload Apache
