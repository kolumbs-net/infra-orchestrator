---
# A service slot: everything a service needs from the host so that its own
# pipeline can build and deploy it with no further infra changes.
#
# The contract with the service's pipeline:
#   - the runner account owns /opt/<slot_name>; the pipeline puts a release
#     there and points /opt/<slot_name>/current at it
#   - the service runs /opt/<slot_name>/current/start as the <slot_name>
#     account, with PORT and the slot's secrets in its environment
#   - anything it keeps goes in $STATE_DIRECTORY (/var/lib/<slot_name>)
#   - the runner may run exactly `systemctl restart <slot_name>`, nothing else
#
# Parameters:
#   slot_name   service and account name
#   slot_port   local port the service listens on (localhost only)
#   slot_route  optional public path on the TLS vhost, proxied as a websocket
#   slot_env    secrets for the service's environment, from the vault

- name: "{{ slot_name }}: check the slot's parameters"
  ansible.builtin.assert:
    that:
      - slot_name is match('^[a-z][a-z0-9-]*$')
      - slot_port | int > 1024
      - slot_env is mapping
      - slot_env.values() | select('string') | select('match', '^[^"\\\\\n]+$') | list | length == slot_env | length
    fail_msg: >-
      {{ slot_name }}: needs a lowercase name, a port above 1024, and non-empty
      secrets without quotes, backslashes or newlines.
  no_log: true

- name: "{{ slot_name }}: service account"
  ansible.builtin.user:
    name: "{{ slot_name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/var/lib/{{ slot_name }}"
    create_home: false
    password_lock: true
    state: present

- name: "{{ slot_name }}: deploy directory, owned by the runner"
  ansible.builtin.file:
    path: "/opt/{{ slot_name }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0755"

- name: "{{ slot_name }}: check whether the slot exists yet"
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ slot_name }}.service"
  register: slot_unit_file

# Only on first provisioning - afterwards the service itself holds the port.
- name: "{{ slot_name }}: read listeners on port {{ slot_port }}"
  ansible.builtin.command: ss -ltnH "sport = :{{ slot_port }}"
  register: slot_port_listeners
  changed_when: false
  check_mode: false
  when: not slot_unit_file.stat.exists

- name: "{{ slot_name }}: ensure port {{ slot_port }} is free"
  ansible.builtin.assert:
    that:
      - slot_port_listeners.stdout | trim | length == 0
    fail_msg: "Port {{ slot_port }} is already in use: {{ slot_port_listeners.stdout }}"
  when: not slot_unit_file.stat.exists

- name: "{{ slot_name }}: configuration directory"
  ansible.builtin.file:
    path: "/etc/{{ slot_name }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Read by systemd as root before it drops to the service account, so neither the
# service account nor the runner can read it.
- name: "{{ slot_name }}: environment with secrets"
  ansible.builtin.template:
    src: service.env.j2
    dest: "/etc/{{ slot_name }}/env"
    owner: root
    group: root
    mode: "0600"
  register: slot_env_file
  no_log: true

- name: "{{ slot_name }}: systemd unit"
  ansible.builtin.template:
    src: service.unit.j2
    dest: "/etc/systemd/system/{{ slot_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: slot_unit

# Enabled but not started: it starts on the first deploy, once a release exists.
- name: "{{ slot_name }}: enable the service"
  ansible.builtin.systemd_service:
    name: "{{ slot_name }}"
    enabled: true
    daemon_reload: "{{ slot_unit.changed }}"

- name: "{{ slot_name }}: restart if its unit or secrets changed"
  ansible.builtin.command: systemctl try-restart {{ slot_name }}
  when: slot_unit.changed or slot_env_file.changed
  changed_when: true

- name: "{{ slot_name }}: let the runner restart it, and nothing else"
  ansible.builtin.template:
    src: service.sudoers.j2
    dest: "/etc/sudoers.d/{{ github_runner_user }}-{{ slot_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: "{{ slot_name }}: public route {{ slot_route | default('(none)') }}"
  ansible.builtin.template:
    src: service.route.conf.j2
    dest: "{{ apache_routes_dir }}/{{ slot_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: slot_route is defined
  notify: Reload Apache
